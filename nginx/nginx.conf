load_module /usr/lib/nginx/modules/ngx_http_geoip2_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Основные настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Кеширование
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  epoch;
        text/css                   max;
        application/javascript     max;
        ~image/                    max;
        ~font/                     max;
    }

    # Страна по IP (см. nginx/Dockerfile). XX = не определена.
    geoip2 /usr/share/GeoIP/dbip-country-lite.mmdb {
        $geoip2_country_code default=XX source=$remote_addr country iso_code;
    }

    # Лимиты на IP: страницы 20 r/s, API 5 r/s (лимит в приложении — вторая линия).
    limit_req_zone $binary_remote_addr zone=pages:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_status 429;

    # Upstream для Next.js
    upstream nextjs_upstream {
        server web:3000;
    }

    # HTTP сервер (редирект на HTTPS)
    server {
        listen 80;
        server_name railguard.ru www.railguard.ru;

        # Для Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Редирект на HTTPS
        location / {
            return 301 https://railguard.ru$request_uri;
        }
    }

    # www -> apex: один хост для поисковиков
    server {
        listen 443 ssl;
        http2 on;
        server_name www.railguard.ru;
        ssl_certificate /etc/nginx/ssl/live/railguard.ru/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/railguard.ru/privkey.pem;
        return 301 https://railguard.ru$request_uri;
    }

    # HTTPS сервер
    server {
        listen 443 ssl;
        http2 on;
        server_name railguard.ru;

        # SSL сертификаты
        ssl_certificate /etc/nginx/ssl/live/railguard.ru/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/railguard.ru/privkey.pem;

        # SSL настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Report-Only: сначала смотрим отчёты в консоли, потом переводим в enforce
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com https://yastatic.net https://www.googletagmanager.com; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.com https://www.google-analytics.com https://*.analytics.google.com; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src blob: https://mc.yandex.ru https://mc.yandex.com; object-src 'none'; base-uri 'self'" always;

        # Статические файлы из public с кешем
        location /webp/ {
            alias /var/www/public/webp/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /favicon.ico {
            alias /var/www/public/favicon.ico;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /robots.txt {
            alias /var/www/public/robots.txt;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # Статика Next.js: без лимита, кеш навсегда (имена файлов с хешем)
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Country $geoip2_country_code;
        }

        # Основное приложение
        location / {
            limit_req zone=pages burst=60 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Country $geoip2_country_code;
            proxy_cache_bypass $http_upgrade;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
