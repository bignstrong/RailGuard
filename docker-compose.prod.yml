services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: railguard_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-railguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railguard_password}
      POSTGRES_DB: ${POSTGRES_DB:-railguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - railguard_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-railguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application (собирается на сервере)
  web:
    build: .
    container_name: railguard_web
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-railguard}:${POSTGRES_PASSWORD:-railguard_password}@postgres:5432/${POSTGRES_DB:-railguard}?schema=public
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://railguard.ru}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - railguard_network
    command: sh -c "npx prisma migrate deploy && npm start"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: railguard_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      - ./public:/var/www/public:ro
    depends_on:
      - web
    networks:
      - railguard_network


volumes:
  postgres_data:
    driver: local

networks:
  railguard_network:
    driver: bridge
